<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Collecting bounded Git evidence</title>
  <desc id="description">Recorded locally · read-only collector. The adjacent article text contains a complete accessible transcript.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020812" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071321"/>
      <stop offset="1" stop-color="#0c2036"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <g filter="url(#shadow)">
    <rect x="48" y="42" width="1504" height="816" rx="25" fill="#0b1829" stroke="#29435f" stroke-width="2"/>
    <path d="M48 126 H1552" stroke="#29435f" stroke-width="2"/>
  </g>
  <circle cx="82" cy="84" r="10" fill="#ff625d"/>
  <circle cx="116" cy="84" r="10" fill="#ffbd45"/>
  <circle cx="150" cy="84" r="10" fill="#27c93f"/>
  <text x="800" y="82" text-anchor="middle" fill="#d7e3f4" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Collecting bounded Git evidence</text>
  <text x="800" y="109" text-anchor="middle" fill="#879ab4" font-family="Inter, Arial, sans-serif" font-size="16">Recorded locally · read-only collector</text>
  <g>
    <text x="98" y="184" fill="#55d6a6" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="21">$ python3 repo-release-notes/skills/repo-release-notes/scripts/collect_changes.py \</text>
    <text x="98" y="218" fill="#55d6a6" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="21">    --repo ../.. --base ad43c78 --head b247a11 --output changes.json</text>
    <text x="98" y="252" fill="#d7e3f4" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="21"></text>
    <text x="98" y="286" fill="#55d6a6" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="21">$ jq -r &#x27;&lt;range and compact commit summary&gt;&#x27; changes.json</text>
    <text x="98" y="320" fill="#70d6ff" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="21">range ad43c78..b247a11 • 5 commits</text>
    <text x="98" y="354" fill="#d7e3f4" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="21">fda6360a7d8b • Modify project title in README • 1 file(s)</text>
    <text x="98" y="388" fill="#d7e3f4" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="21">ca3406fee88a • Fix HTML entities in project title in README • 1 file(s)</text>
    <text x="98" y="422" fill="#f9cb6b" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="21">12b736b18d56 • Add topics/a2a .DS_Store and __pycache__ files • 24 file(s)</text>
    <text x="98" y="456" fill="#d7e3f4" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="21">5a6ef2307af1 • Add .gitignore and remove generated files • 2 file(s)</text>
    <text x="98" y="490" fill="#d7e3f4" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="21">b247a11f7c5c • Add A2A travel agent tutorial project • 35 file(s)</text>
    <text x="98" y="524" fill="#d7e3f4" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="21"></text>
    <text x="98" y="558" fill="#879ab4" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="21">The noisy cache commit is evidence—but not a customer-facing release item.</text>
  </g>
  <rect x="1220" y="806" width="286" height="31" rx="15" fill="#102a43" stroke="#29435f"/>
  <text x="1363" y="827" text-anchor="middle" fill="#9fb3c8" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">SANITIZED RECORDED OUTPUT</text>
</svg>
