<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">A2A travel-agent architecture</title>
  <desc id="description">A traveler asks a Trip Coordinator, which discovers and delegates to a Packing Advisor over A2A. The Packing Advisor privately calls Open-Meteo over HTTPS and returns Task updates and a packing-plan Artifact.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f2841" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#f7fafc"/>
  <text x="80" y="92" fill="#102a43" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="700">The A2A boundary in this project</text>
  <text x="80" y="140" fill="#486581" font-family="Inter, Arial, sans-serif" font-size="24">The coordinator delegates a goal; the advisor keeps its implementation private.</text>

  <rect x="300" y="220" width="900" height="490" rx="36" fill="#e9f3fb" stroke="#7eb6df" stroke-width="3" stroke-dasharray="12 10"/>
  <text x="340" y="266" fill="#1769aa" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1">A2A PROTOCOL 1.0 · JSON-RPC</text>

  <g filter="url(#shadow)">
    <rect x="70" y="350" width="190" height="170" rx="28" fill="#ffffff" stroke="#bcccdc" stroke-width="2"/>
    <circle cx="165" cy="403" r="25" fill="#d9e2ec"/>
    <path d="M 120 478 C 128 438, 202 438, 210 478" fill="#d9e2ec"/>
    <text x="165" y="505" text-anchor="middle" fill="#102a43" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Traveler</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="355" y="325" width="330" height="220" rx="28" fill="#ffffff" stroke="#1769aa" stroke-width="3"/>
    <text x="520" y="400" text-anchor="middle" fill="#102a43" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="700">Trip Coordinator</text>
    <text x="520" y="442" text-anchor="middle" fill="#486581" font-family="Inter, Arial, sans-serif" font-size="22">local client agent</text>
    <rect x="419" y="474" width="202" height="40" rx="20" fill="#dbeeff"/>
    <text x="520" y="501" text-anchor="middle" fill="#1769aa" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">discovers + delegates</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="820" y="325" width="330" height="220" rx="28" fill="#ffffff" stroke="#087f8c" stroke-width="3"/>
    <text x="985" y="400" text-anchor="middle" fill="#102a43" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="700">Packing Advisor</text>
    <text x="985" y="442" text-anchor="middle" fill="#486581" font-family="Inter, Arial, sans-serif" font-size="22">remote agent</text>
    <rect x="884" y="474" width="202" height="40" rx="20" fill="#dff5f3"/>
    <text x="985" y="501" text-anchor="middle" fill="#087f8c" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">owns the Task</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1300" y="350" width="230" height="170" rx="28" fill="#ffffff" stroke="#829ab1" stroke-width="2"/>
    <path d="M 1361 416 C 1367 386, 1405 379, 1424 401 C 1446 385, 1480 401, 1475 431 C 1495 438, 1490 469, 1467 469 L 1373 469 C 1342 469, 1338 428, 1361 416" fill="#d9e2ec"/>
    <text x="1415" y="505" text-anchor="middle" fill="#102a43" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">Open-Meteo</text>
  </g>

  <path d="M 260 435 L 330 435" fill="none" stroke="#627d98" stroke-width="4"/>
  <path d="M 330 421 L 350 435 L 330 449 z" fill="#1769aa"/>
  <text x="301" y="414" text-anchor="middle" fill="#486581" font-family="Inter, Arial, sans-serif" font-size="18">trip goal</text>

  <path d="M 685 380 C 730 315, 770 315, 806 369" fill="none" stroke="#1769aa" stroke-width="5"/>
  <path d="M 799 357 L 818 380 L 790 374 z" fill="#1769aa"/>
  <text x="752" y="310" text-anchor="middle" fill="#1769aa" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Agent Card + Message</text>

  <path d="M 820 500 C 775 575, 730 575, 699 512" fill="none" stroke="#087f8c" stroke-width="5"/>
  <path d="M 706 525 L 685 500 L 713 508 z" fill="#087f8c"/>
  <text x="752" y="605" text-anchor="middle" fill="#087f8c" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Task updates + Artifact</text>

  <path d="M 1150 435 L 1277 435" fill="none" stroke="#627d98" stroke-width="4"/>
  <path d="M 1277 421 L 1297 435 L 1277 449 z" fill="#087f8c"/>
  <text x="1218" y="414" text-anchor="middle" fill="#486581" font-family="Inter, Arial, sans-serif" font-size="18">HTTPS forecast</text>

  <rect x="300" y="755" width="900" height="86" rx="20" fill="#102a43"/>
  <text x="750" y="790" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">A2A standardizes the collaboration boundary.</text>
  <text x="750" y="821" text-anchor="middle" fill="#c9e6fb" font-family="Inter, Arial, sans-serif" font-size="19">The advisor may use deterministic code, an LLM, MCP tools, or any other private implementation.</text>
</svg>
