[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "weather-mcp-learning"
version = "0.1.0"
description = "A small, end-to-end weather MCP server and client learning project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "mcp==2.1.1",
  "openai==3.7.0",
  "pydantic==2.13.5",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.5",
]

[project.scripts]
weather-mcp = "weather_mcp.cli:main"
weather-mcp-server = "weather_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "live: opt-in tests that call the live Open-Meteo service",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

